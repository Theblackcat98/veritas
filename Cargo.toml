[package]
name = "veritas-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui-textarea = "0.9"
unicode-width = "0.2"
textwrap = "0.16"
sysinfo = "0.39.6"
tui-markdown = "0.3"
tui-shimmer = "0.1.3"
